name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain and simulator
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc simavr
      - name: Unit tests (ring buffer and lecture demos, with sanitizers)
        run: make test
      - name: Arduino sketch compiles for the ATmega328P
        run: make sketch
      - name: Self-test on a simulated ATmega328P
        run: make avr && grep -q "SELF-TEST PASS" results/avr_selftest.txt
